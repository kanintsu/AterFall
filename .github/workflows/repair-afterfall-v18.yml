name: Repair Afterfall V18 Syntax

on:
  push:
    paths:
      - '.github/workflows/repair-afterfall-v18.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair main.gd inside V18 archive
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/afterfall-repair
          mkdir -p /tmp/afterfall-repair
          unzip -q AfterfallBuriedV18-Project.zip -d /tmp/afterfall-repair

          MAIN="$(find /tmp/afterfall-repair -type f -path '*/scripts/main.gd' -print -quit)"
          test -n "$MAIN"
          export MAIN

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["MAIN"])
          lines = path.read_text(encoding="utf-8").splitlines()

          needle = 'inventory.bandage+=1; if careful: inventory.med+=1; else: stress=mini(100,stress+2); _add_event(location_name,"O material médico aproveitável foi separado do que já estava contaminado.")'

          matches = [i for i, line in enumerate(lines) if needle in line]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one medical-room line, found {len(matches)}")

          i = matches[0]
          line = lines[i]
          indent = line[:len(line) - len(line.lstrip(" \t"))]
          child = indent + "\t"

          replacement = [
              indent + "inventory.bandage+=1",
              indent + "if careful:",
              child + "inventory.med+=1",
              indent + "else:",
              child + "stress=mini(100,stress+2)",
              indent + '_add_event(location_name,"O material médico aproveitável foi separado do que já estava contaminado.")',
          ]
          lines[i:i+1] = replacement

          leftovers = [(n + 1, line) for n, line in enumerate(lines) if "; else:" in line]
          print("Remaining '; else:' patterns:", len(leftovers))
          for item in leftovers[:20]:
              print(item)
          if leftovers:
              raise SystemExit("Other same-line else patterns remain; inspect before build.")

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Patched", path)
          PY

          echo "Corrected area:"
          nl -ba "$MAIN" | sed -n '6445,6468p'

          rm -f "$GITHUB_WORKSPACE/AfterfallBuriedV18-Project.zip"
          (
            cd /tmp/afterfall-repair
            zip -qr "$GITHUB_WORKSPACE/AfterfallBuriedV18-Project.zip" .
          )
          test -s "$GITHUB_WORKSPACE/AfterfallBuriedV18-Project.zip"

      - name: Commit repaired project archive
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Afterfall Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add AfterfallBuriedV18-Project.zip
          git diff --cached --quiet && exit 0
          git commit -m "Fix V18 GDScript medical-room syntax"
          git push origin HEAD:main
