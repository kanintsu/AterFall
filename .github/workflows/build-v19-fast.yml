name: Fast Build AFTERFALL V19

on:
  push:
    paths:
      - '.github/workflows/build-v19-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Godot and templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot && unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -L --fail --retry 4 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p /tmp/templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Android config
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import and strict parse check
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 180s "$GODOT" --headless --editor --path game --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Invalid access|Invalid call" import.log
      - name: Smoke render map
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 45s "$GODOT" --headless --path game -- --capture_map 2>&1 | tee map.log
          test -s game/capture_map.png
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid call" map.log
      - name: Smoke render inventory
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 45s "$GODOT" --headless --path game -- --capture_v14inventory 2>&1 | tee inventory.log
          test -s game/capture_v14inventory.png
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid call" inventory.log
      - name: Smoke render location
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 45s "$GODOT" --headless --path game -- --capture_v17location 2>&1 | tee location.log
          test -s game/capture_v17location.png
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid call" location.log
      - name: Export APK
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          PRESET="$(awk -F'"' '/^name="/ {print $2; exit}' game/export_presets.cfg)"
          mkdir -p build
          "$GODOT" --headless --path game --export-debug "$PRESET" "$GITHUB_WORKSPACE/build/Afterfall-Buried-Days-V19.apk" 2>&1 | tee export.log
          ! grep -E "SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Invalid access|Invalid call" export.log
          test -s build/Afterfall-Buried-Days-V19.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose build/Afterfall-Buried-Days-V19.apk
          sha256sum build/Afterfall-Buried-Days-V19.apk | tee build/Afterfall-Buried-Days-V19.apk.sha256
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Afterfall-V19-Fast-Build
          path: |
            build/Afterfall-Buried-Days-V19.apk
            build/Afterfall-Buried-Days-V19.apk.sha256
            game/capture_map.png
            game/capture_v14inventory.png
            game/capture_v17location.png
            *.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

# rerun-after-indentation-fix
