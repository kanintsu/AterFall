name: Inspect Afterfall Main GDScript

on:
  push:
    paths:
      - '.github/workflows/inspect-afterfall-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect boss QA and combat progression
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/afterfall
          mkdir -p /tmp/afterfall
          unzip -q AfterfallBuriedV18-Project.zip -d /tmp/afterfall
          MAIN="$(find /tmp/afterfall -type f -path '*/scripts/main.gd' -print -quit)"
          test -n "$MAIN"
          echo "---- QA boss area 6300-6360 ----"
          nl -ba "$MAIN" | sed -n '6300,6360p'
          echo "---- boss-related functions ----"
          grep -n -C 5 -E 'boss|BOSS|combat_victory|boss_progress|bosses' "$MAIN" | head -300
