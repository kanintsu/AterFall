name: Inspect Afterfall Main GDScript

on:
  push:
    paths:
      - '.github/workflows/inspect-afterfall-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect V18 QA command hook
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/afterfall
          mkdir -p /tmp/afterfall
          unzip -q AfterfallBuriedV18-Project.zip -d /tmp/afterfall
          MAIN="$(find /tmp/afterfall -type f -path '*/scripts/main.gd' -print -quit)"
          test -n "$MAIN"
          echo "---- qa_v18 references ----"
          grep -n -C 5 -E 'qa_v18|_run_v18_qa|qa_all' "$MAIN" || true
