name: QA Afterfall V18

on:
  push:
    paths:
      - '.github/workflows/qa-afterfall-v18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5             -o /tmp/godot.zip             https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Extract project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf project project-flat
          mkdir -p project
          unzip -q AfterfallBuriedV18-Project.zip -d project
          if [ ! -f project/project.godot ]; then
            CANDIDATE="$(find project -mindepth 2 -maxdepth 4 -name project.godot -print -quit)"
            test -n "$CANDIDATE"
            ROOT="$(dirname "$CANDIDATE")"
            mkdir -p project-flat
            cp -a "$ROOT/." project-flat/
            rm -rf project
            mv project-flat project
          fi
          test -f project/project.godot

      - name: Import assets
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 300s "$GODOT" --headless --editor --path project --import 2>&1 | tee qa-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Cannot open file" qa-import.log; then
            exit 3
          fi

      - name: Run V18 QA
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 180s "$GODOT" --headless --path project -- --qa_v18 2>&1 | tee qa-v18.log
          grep -F "V18_QA" qa-v18.log
          if grep -E "SCRIPT ERROR|Parse Error|Parser Error|Invalid access|Invalid call" qa-v18.log; then
            echo "Runtime error detected in V18 QA."
            exit 4
          fi

      - name: Run regression QA ALL
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 240s "$GODOT" --headless --path project -- --qa_all 2>&1 | tee qa-all.log
          if grep -E "SCRIPT ERROR|Parse Error|Parser Error|Invalid access|Invalid call" qa-all.log; then
            echo "Runtime error detected in regression QA."
            exit 5
          fi

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Afterfall-V18-QA-Logs
          path: |
            qa-import.log
            qa-v18.log
            qa-all.log
          retention-days: 14
