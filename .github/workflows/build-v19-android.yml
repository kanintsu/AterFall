name: Build AFTERFALL V19 Android

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/build-v19-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and Android templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -L --fail --retry 5 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and parse-check project
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 300s "$GODOT" --headless --editor --path game --quit-after 12 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Cannot open file" godot-import.log; then
            echo "Fatal Godot error during import."
            exit 3
          fi

      - name: Run V18 regression QA
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 300s "$GODOT" --headless --path game -- --qa_v18 2>&1 | tee qa-v18.log
          grep -E "V18_QA.*failures=\[\]" qa-v18.log

      - name: Render V19 UI smoke captures
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 180s "$GODOT" --headless --path game -- --capture_map 2>&1 | tee capture-map.log
          timeout 180s "$GODOT" --headless --path game -- --capture_v14inventory 2>&1 | tee capture-inventory.log
          timeout 180s "$GODOT" --headless --path game -- --capture_v10characters 2>&1 | tee capture-characters.log || true
          timeout 180s "$GODOT" --headless --path game -- --capture_v17location 2>&1 | tee capture-location.log
          test -s game/capture_map.png
          test -s game/capture_v14inventory.png
          test -s game/capture_v17location.png

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          PRESET="$(awk -F'"' '/^name="/ {print $2; exit}' game/export_presets.cfg)"
          test -n "$PRESET"
          mkdir -p build
          "$GODOT" --headless --path game --export-debug "$PRESET" "$GITHUB_WORKSPACE/build/Afterfall-Buried-Days-V19.apk" 2>&1 | tee godot-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Cannot open file" godot-export.log; then
            exit 4
          fi
          test -s build/Afterfall-Buried-Days-V19.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose build/Afterfall-Buried-Days-V19.apk
          sha256sum build/Afterfall-Buried-Days-V19.apk | tee build/Afterfall-Buried-Days-V19.apk.sha256
          ls -lh build/Afterfall-Buried-Days-V19.apk

      - name: Upload V19 APK and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Afterfall-Buried-Days-V19-Android
          path: |
            build/Afterfall-Buried-Days-V19.apk
            build/Afterfall-Buried-Days-V19.apk.sha256
            game/capture_map.png
            game/capture_v14inventory.png
            game/capture_v10characters.png
            game/capture_v17location.png
            godot-import.log
            qa-v18.log
            godot-export.log
            capture-*.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
