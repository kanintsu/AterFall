name: Apply AFTERFALL V19 Rebuild

on:
  push:
    paths:
      - '.github/workflows/apply-v19-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create V19 visual assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p game/assets/v19
          cat > game/assets/v19/city_map.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1075" height="555" viewBox="0 0 1075 555">
            <defs>
              <filter id="noise">
                <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="13"/>
                <feColorMatrix type="saturate" values="0"/>
                <feComponentTransfer><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer>
              </filter>
              <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity=".65"/></filter>
              <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
                <path d="M34 0H0V34" fill="none" stroke="#6d6556" stroke-width=".7" opacity=".16"/>
              </pattern>
