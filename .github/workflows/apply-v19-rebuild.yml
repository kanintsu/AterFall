            <g fill="#34372f" stroke="#565948" stroke-width="1.5" opacity=".95">
              <path d="M48 333h235v168H48z"/><path d="M307 265h250v225H307z"/>
              <path d="M568 326h270v177H568z"/><path d="M790 54h225v196H790z"/>
              <path d="M115 72h256v165H115z"/><path d="M390 55h335v174H390z"/>
            </g>
            <g stroke="#a79a7b" stroke-width="12" fill="none" opacity=".55">
              <path d="M72 423L431 305L792 372L928 150"/>
