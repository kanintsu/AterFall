name: QA AFTERFALL V19 Full Regression

on:
  push:
    paths:
      - '.github/workflows/qa-v19-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import and strict parse check
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 240s "$GODOT" --headless --editor --path game --import 2>&1 | tee qa-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Invalid access|Invalid call" qa-import.log; then exit 3; fi

      - name: V18 systems regression on V19 code
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 180s "$GODOT" --headless --path game -- --qa_v18 2>&1 | tee qa-v18-on-v19.log
          grep -E "V18_QA.*failures=\[\]" qa-v18-on-v19.log
          if grep -E "SCRIPT ERROR|Parse Error|Parser Error|Invalid access|Invalid call" qa-v18-on-v19.log; then exit 4; fi

      - name: Full legacy regression
        shell: bash
        run: |
          set -o pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          timeout 300s "$GODOT" --headless --path game -- --qa_all 2>&1 | tee qa-all-v19.log
          if grep -E "SCRIPT ERROR|Parse Error|Parser Error|Invalid access|Invalid call" qa-all-v19.log; then exit 5; fi
          grep -E "QA_ALL|failures=0|FAILURES=0" qa-all-v19.log | tail -20 || true

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Afterfall-V19-Full-QA
          path: |
            qa-import.log
            qa-v18-on-v19.log
            qa-all-v19.log
          if-no-files-found: warn
          retention-days: 14
